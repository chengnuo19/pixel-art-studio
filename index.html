<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pixel Art Studio — 像素艺术编辑器</title>
  <meta name="description" content="将图片转换为像素画，支持在线编辑、调色板管理和导出功能">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Drop Overlay -->
  <div id="dropOverlay" class="drop-overlay">
    <div class="drop-overlay-content">
      <div class="drop-icon">
        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <p class="drop-text">释放以导入图片</p>
    </div>
  </div>

  <!-- Pixelation Animation Overlay -->
  <div id="pixelAnimOverlay" class="pixel-anim-overlay hidden">
    <canvas id="animCanvas"></canvas>
    <div class="anim-progress">
      <div class="anim-progress-bar" id="animProgressBar"></div>
    </div>
    <p class="anim-text">像素化中...</p>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <h1 class="logo">
        <span class="logo-icon">◈</span>
        <span class="logo-text">PIXEL STUDIO</span>
      </h1>
    </div>
    <div class="header-center">
      <div class="canvas-info" id="canvasInfo">
        <span id="dimensionInfo">—</span>
        <span class="info-sep">|</span>
        <span id="zoomInfo">100%</span>
      </div>
    </div>
    <div class="header-right">
      <button class="btn btn-ghost" id="btnImport" title="导入图片">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span>导入</span>
      </button>
      <button class="btn btn-primary" id="btnExport" title="导出PNG" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>导出</span>
      </button>
      <input type="file" id="fileInput" accept="image/*" hidden>
    </div>
  </header>

  <!-- Main Layout -->
  <main class="main-layout">
    <!-- Left Toolbar -->
    <aside class="toolbar" id="toolbar">
      <div class="tool-group">
        <button class="tool-btn active" data-tool="pencil" title="铅笔 (B)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
          <span class="tool-label">铅笔</span>
        </button>
        <button class="tool-btn" data-tool="eraser" title="橡皮擦 (E)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
          <span class="tool-label">橡皮</span>
        </button>
        <button class="tool-btn" data-tool="fill" title="填充 (G)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 2-3 2-3s2 1.4 2 3Z"/></svg>
          <span class="tool-label">填充</span>
        </button>
        <button class="tool-btn" data-tool="eyedropper" title="吸管 (I)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9"/></svg>
          <span class="tool-label">吸管</span>
        </button>
        <button class="tool-btn" data-tool="move" title="移动 (V)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
          <span class="tool-label">移动</span>
        </button>
      </div>

      <div class="tool-divider"></div>

      <div class="tool-group">
        <button class="tool-btn" id="btnUndo" title="撤销 (Ctrl+Z)" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          <span class="tool-label">撤销</span>
        </button>
        <button class="tool-btn" id="btnRedo" title="重做 (Ctrl+Y)" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          <span class="tool-label">重做</span>
        </button>
      </div>

      <div class="tool-divider"></div>

      <div class="tool-group">
        <button class="tool-btn" id="btnGrid" title="网格 (H)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>
          <span class="tool-label">网格</span>
        </button>
        <button class="tool-btn" id="btnZoomIn" title="放大 (+)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          <span class="tool-label">放大</span>
        </button>
        <button class="tool-btn" id="btnZoomOut" title="缩小 (-)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          <span class="tool-label">缩小</span>
        </button>
        <button class="tool-btn" id="btnViewOriginal" title="按住查看原图">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          <span class="tool-label">原图</span>
        </button>
      </div>
    </aside>

    <!-- Canvas Area -->
    <section class="canvas-area" id="canvasArea">
      <!-- Welcome Screen -->
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-content">
          <div class="welcome-icon-grid">
            <div class="pixel-block" style="--delay:0"></div>
            <div class="pixel-block" style="--delay:1"></div>
            <div class="pixel-block" style="--delay:2"></div>
            <div class="pixel-block" style="--delay:3"></div>
            <div class="pixel-block" style="--delay:4"></div>
            <div class="pixel-block" style="--delay:5"></div>
            <div class="pixel-block" style="--delay:6"></div>
            <div class="pixel-block" style="--delay:7"></div>
            <div class="pixel-block" style="--delay:8"></div>
          </div>
          <h2 class="welcome-title">开始创作像素画</h2>
          <p class="welcome-desc">拖拽或点击下方按钮导入一张图片</p>
          <button class="btn btn-primary btn-lg" id="btnWelcomeImport">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            选择图片
          </button>
        </div>
      </div>

      <!-- Main Canvas -->
      <div class="canvas-wrapper" id="canvasWrapper" style="display:none">
        <canvas id="mainCanvas"></canvas>
        <canvas id="gridCanvas"></canvas>
        <canvas id="cursorCanvas"></canvas>
      </div>
    </section>

    <!-- Right Sidebar -->
    <aside class="sidebar" id="sidebar">
      <!-- Pixel Size -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">像素化设置</span>
        </div>
        <div class="panel-body">
          <div class="control-row">
            <label class="control-label">像素分辨率 (格宽)</label>
            <div class="slider-row">
              <input type="range" id="pixelSizeSlider" class="slider" min="8" max="128" value="32" step="1">
              <span class="slider-value" id="pixelSizeValue">32格宽</span>
            </div>
          </div>
          <div class="control-row">
            <label class="control-label">风格预设</label>
            <select id="paletteSelect" class="select-input">
              <option value="mario">经典马里奥风 (FC红白机)</option>
              <option value="auto">自动提取 (原图色彩)</option>
              <option value="gameboy">GameBoy (经典4绿)</option>
              <option value="nes">FC/NES (复古色彩)</option>
              <option value="cga">CGA (紫青配色)</option>
              <option value="bw">黑白两色</option>
            </select>
          </div>
          <div class="control-row checkbox-row">
            <label class="checkbox-label">
              <input type="checkbox" id="kuwaharaCheck" checked> 开启手绘净化 (Kuwahara)
            </label>
          </div>
          <div class="control-row checkbox-row">
            <label class="checkbox-label">
              <input type="checkbox" id="ditherCheck"> 开启像素抖动
            </label>
          </div>
          <div class="control-row checkbox-row">
            <label class="checkbox-label">
              <input type="checkbox" id="edgeCheck"> 强化边缘描边
            </label>
          </div>
        </div>
      </div>

      <!-- Current Color -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">当前颜色</span>
        </div>
        <div class="panel-body">
          <div class="color-picker-row">
            <div class="current-color-preview" id="currentColorPreview"></div>
            <input type="color" id="colorPicker" class="color-input" value="#ffffff">
            <span class="color-hex" id="colorHex">#FFFFFF</span>
          </div>
          <div class="control-row" style="margin-top:8px">
            <label class="control-label">笔刷大小</label>
            <div class="slider-row">
              <input type="range" id="brushSizeSlider" class="slider" min="1" max="8" value="1" step="1">
              <span class="slider-value" id="brushSizeValue">1</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Palette -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">调色板</span>
          <button class="panel-action" id="btnClearPalette" title="清除调色板">✕</button>
        </div>
        <div class="panel-body">
          <div class="palette-grid" id="paletteGrid">
            <div class="palette-empty">导入图片后自动提取</div>
          </div>
        </div>
      </div>

      <!-- Export Settings -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">导出设置</span>
        </div>
        <div class="panel-body">
          <div class="control-row">
            <label class="control-label">缩放倍数</label>
            <div class="slider-row">
              <input type="range" id="exportScaleSlider" class="slider" min="1" max="20" value="10" step="1">
              <span class="slider-value" id="exportScaleValue">10x</span>
            </div>
          </div>
          <button class="btn btn-primary btn-block" id="btnExportPNG" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            导出 PNG
          </button>
        </div>
      </div>
    </aside>
  </main>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
